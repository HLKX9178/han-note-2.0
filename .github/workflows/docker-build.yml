name: Build & Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            dockerfile: hannote-gateway/Dockerfile
            image: hannote-gateway
          - service: auth
            dockerfile: hannote-auth/Dockerfile
            image: hannote-auth
          - service: oss
            dockerfile: hannote-oss/hannote-oss-biz/Dockerfile
            image: hannote-oss
          - service: user
            dockerfile: hannote-user/hannote-user-biz/Dockerfile
            image: hannote-user
          - service: kv
            dockerfile: hannote-kv/hannote-kv-biz/Dockerfile
            image: hannote-kv
          - service: id
            dockerfile: hannote-distributed-id-generator/hannote-distributed-id-generator-biz/Dockerfile
            image: hannote-id
          - service: note
            dockerfile: hannote-note/hannote-note-biz/Dockerfile
            image: hannote-note
          - service: relation
            dockerfile: hannote-user-relation/hannote-user-relation-biz/Dockerfile
            image: hannote-user-relation
          - service: count
            dockerfile: hannote-count/hannote-count-biz/Dockerfile
            image: hannote-count
          - service: data-align
            dockerfile: hannote-data-align/Dockerfile
            image: hannote-data-align
          - service: search
            dockerfile: hannote-search/Dockerfile
            image: hannote-search
          - service: comment
            dockerfile: hannote-comment/hannote-comment-biz/Dockerfile
            image: hannote-comment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
