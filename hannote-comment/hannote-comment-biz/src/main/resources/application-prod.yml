spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR}
        namespace: ${NACOS_NAMESPACE:hannote}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${PG_HOST}:${PG_PORT:5432}/${PG_DATABASE:hannote}
    username: ${PG_USERNAME}
    password: ${PG_PASSWORD}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 60000
      idle-timeout: 300000
      max-lifetime: 900000
      pool-name: HannoteHikariPool
  data:
    redis:
      database: ${REDIS_DATABASE:0}
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 5s
      connect-timeout: 5s
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          min-idle: 0
          max-idle: 10

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER}
  producer:
    group: hannote_comment_group
    send-message-timeout: 3000
    retry-times-when-send-failed: 0
    retry-times-when-send-async-failed: 0
    max-message-size: 4096
  consumer:
    group: hannote_comment_group
    pull-batch-size: 30

powerjob:
  worker:
    server-address: ${POWERJOB_SERVER_ADDR}
    app-name: hannote-comment
    port: ${POWERJOB_WORKER_PORT:27777}
    store-strategy: disk
