spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR}
        namespace: ${NACOS_NAMESPACE:hannote}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

storage:
  type: ${STORAGE_TYPE:rustfs}

rustfs:
  endpoint: ${RUSTFS_ENDPOINT}
  access-key: ${RUSTFS_ACCESS_KEY}
  secret-key: ${RUSTFS_SECRET_KEY}
  region: ${RUSTFS_REGION:us-east-1}
  bucket: ${RUSTFS_BUCKET:hannote}

tencent:
  cos:
    secret-id: ${TENCENT_COS_SECRET_ID}
    secret-key: ${TENCENT_COS_SECRET_KEY}
    region: ${TENCENT_COS_REGION:ap-guangzhou}
    bucket: ${TENCENT_COS_BUCKET}
    custom-domain: ${TENCENT_COS_CUSTOM_DOMAIN:}
